# Configuración de Netlify (despliegue del frontend desde GitHub).
# Las reglas de redirección y cabeceras están en frontend/public/_redirects y
# frontend/public/_headers para que funcionen también si subes la carpeta dist
# arrastrándola a Netlify.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Servidor de Compartir y Campañas (ver docs/SUPABASE.md). La clave
  # «publishable» es pública por diseño: con ella no se pueden leer las tablas,
  # sólo llamar a las funciones, que comprueban claves y permisos.
  VITE_SUPABASE_URL = "https://oybuikuqsmnwskmkmzsz.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_OPIV8V7n3QFxfzosyb_fGA_AbdZbZ2_"
